[tool.pytest.ini_options]
pythonpath = [".", "ci"]
testpaths = ["tests"]
# A leaked file or socket only warns by default; fail on it instead.
filterwarnings = ["error"]

[tool.ruff.lint]
# Deliberate style here: root logger, catch-all excepts around BLE I/O, naive local
# datetimes for session dates, and a ValueError raised to share an except clause.
ignore = ["LOG015", "BLE001", "DTZ005", "TRY004"]

[tool.coverage.run]
omit = ["tests/*"]
