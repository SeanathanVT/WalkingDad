{% extends "base.html" %}
{% block content %}
<div class="text-center">
    <h1 class="content-title mb-4">Active Session</h1>

    <div class="row g-4 mb-5">
      <div class="col-lg col-md-4 col-6">
          <div class="stat-card">
              <p class="stat-label">Time</p>
              <p class="stat-value" id="time_active">{{ time_active }}</p>
          </div>
      </div>
      <div class="col-lg col-md-4 col-6"> <div class="stat-card">
              <p class="stat-label">Speed</p>
              <p class="stat-value" id="speed">{{ "%.1f"|format(speed) }} mph</p>
          </div>
      </div>
      <div class="col-lg col-md-4 col-6">
          <div class="stat-card">
              <p class="stat-label">Distance</p>
              <p class="stat-value" id="distance">{{ "%.2f"|format(distance) }} mi</p>
          </div>
      </div>
      <div class="col-lg col-md-4 col-6">
          <div class="stat-card">
              <p class="stat-label">Steps</p>
              <p class="stat-value" id="steps">{{ steps|int }}</p>
          </div>
      </div>
      <div class="col-lg col-md-4 col-6">
          <div class="stat-card">
              <p class="stat-label">Calories</p>
              <p class="stat-value" id="calories">{{ "%.0f"|format(calories) }}</p>
          </div>
      </div>
  </div>

    <p id="transitioning-hint" class="text-muted mb-2" style="display:none;font-size:0.9rem;">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Getting the belt moving&hellip;
    </p>

    <div class="d-flex justify-content-center gap-2 mb-3">
        <form method="post" action="{{ url_for('slow_speed') }}" style="display:contents">
            <button type="submit" class="btn btn-custom-primary d-flex align-items-center gap-2">
                <i class="bi bi-person-walking"></i> Slow
            </button>
        </form>
        <form method="post" action="{{ url_for('decrease_speed') }}" style="display:contents">
            <button type="submit" class="btn btn-custom-primary d-flex align-items-center gap-2">
                <i class="bi bi-dash-lg"></i> Decrease
            </button>
        </form>
        <form method="post" action="{{ url_for('pause_session') }}" style="display:contents">
            <button type="submit" class="btn btn-custom-primary d-flex align-items-center gap-2">
                <i class="bi bi-pause-fill"></i> Pause
            </button>
        </form>
        <form method="post" action="{{ url_for('increase_speed') }}" style="display:contents">
            <button type="submit" class="btn btn-custom-primary d-flex align-items-center gap-2">
                <i class="bi bi-plus-lg"></i> Increase
            </button>
        </form>
        <form method="post" action="{{ url_for('max_speed') }}" style="display:contents">
            <button type="submit" class="btn btn-custom-primary d-flex align-items-center gap-2">
                <i class="bi bi-speedometer"></i> Max
            </button>
        </form>
    </div>
    <form method="post" action="{{ url_for('end_session') }}" style="display:inline">
        <button type="submit" class="btn btn-custom-danger">
            <i class="bi bi-stop-fill"></i> End Session
        </button>
    </form>
</div>

<script>
  // Disable all action buttons immediately on any form submit so a double-tap
  // or slow network can't dispatch a second belt command before the page reloads.
  document.querySelectorAll('form').forEach(function(form) {
    form.addEventListener('submit', function() {
      document.querySelectorAll('button[type="submit"]').forEach(function(b) {
        b.disabled = true;
        b.style.opacity = '0.5';
      });
    });
  });

  // Mirrors paused_session.html's setTransitioning(): a fresh Start or a
  // Resume both redirect here the instant belt_running flips true, which can
  // be well before the backend's wake-up sequence actually finishes (up to
  // several seconds on a slow connection) -- without this, the buttons are
  // live and clickable during that window even though a belt command is
  // already in flight. Reuses the same generic button selector as the
  // reactive disable-on-submit handler above, rather than per-button ids.
  function setTransitioning(on) {
    var hint = document.getElementById('transitioning-hint');
    hint.style.display = on ? '' : 'none';
    document.querySelectorAll('button[type="submit"]').forEach(function(b) {
      b.disabled = on;
      b.style.opacity = on ? '0.5' : '';
    });
  }

  startStatsStream(function(data) {
    setTransitioning(data.belt_transitioning === true);
    // Check if the server has auto-paused the session
    if (data.is_running === false) {
      window.location.reload();
    } else {
      // Update the stats on the current page
      document.getElementById("time_active").innerText = data.time_active;
      document.getElementById("speed").innerText = data.speed.toFixed(1) + ' mph';
      document.getElementById("distance").innerText = data.distance.toFixed(2) + ' mi';
      document.getElementById("steps").innerText = parseInt(data.steps, 10);
      document.getElementById("calories").innerText = data.calories.toFixed(0);
    }
  });
</script>

{% endblock %}
