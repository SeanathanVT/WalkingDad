{% extends "base.html" %}
{% block content %}
<div class="text-center">
    <h1 class="visually-hidden">Active Session</h1>
    <div class="console-hero">
        <span class="console-hero-label">Speed</span>
        <div class="console-hero-controls">
            <form method="post" action="{{ url_for('decrease_speed') }}" style="display:contents">
                <button type="submit" class="stepper-btn" aria-label="Decrease speed"><i class="bi bi-dash-lg"></i></button>
            </form>
            <div>
                <span class="console-hero-value" id="speed">{{ "%.1f"|format(speed) }}</span><span class="console-hero-unit">mph</span>
            </div>
            <form method="post" action="{{ url_for('increase_speed') }}" style="display:contents">
                <button type="submit" class="stepper-btn" aria-label="Increase speed"><i class="bi bi-plus-lg"></i></button>
            </form>
        </div>
        <p id="transitioning-hint" class="text-muted mt-3 mb-0" style="display:none;font-size:0.85rem;">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Getting the belt moving&hellip;
        </p>
    </div>

    <div class="console-strip">
        <div class="console-strip-item">
            <span class="console-strip-label">Time</span>
            <span class="console-strip-value" id="time_active">{{ time_active }}</span>
        </div>
        <div class="console-strip-item">
            <span class="console-strip-label">Distance</span>
            <span class="console-strip-value" id="distance">{{ "%.2f"|format(distance) }} mi</span>
        </div>
        <div class="console-strip-item">
            <span class="console-strip-label">Steps</span>
            <span class="console-strip-value" id="steps">{{ steps|int }}</span>
        </div>
        <div class="console-strip-item">
            <span class="console-strip-label">Calories</span>
            <span class="console-strip-value" id="calories">{{ "%.0f"|format(calories) }}</span>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-2 mt-4">
        <form method="post" action="{{ url_for('min_speed') }}" style="display:contents">
            <button type="submit" class="btn btn-preset">Slow</button>
        </form>
        <form method="post" action="{{ url_for('slow_speed') }}" style="display:contents">
            <button type="submit" class="btn btn-preset">Moderate</button>
        </form>
        <form method="post" action="{{ url_for('max_speed') }}" style="display:contents">
            <button type="submit" class="btn btn-preset">Max</button>
        </form>
    </div>
    <div class="d-flex justify-content-center gap-2 mt-3">
        <form method="post" action="{{ url_for('pause_session') }}" style="display:contents">
            <button type="submit" class="btn btn-custom-primary d-flex align-items-center gap-2">
                <i class="bi bi-pause-fill"></i> Pause
            </button>
        </form>
        <form method="post" action="{{ url_for('end_session') }}" style="display:contents">
            <button type="submit" class="btn btn-custom-danger">
                <i class="bi bi-stop-fill"></i> End Session
            </button>
        </form>
    </div>
</div>

<script>
  // A fresh Start or a Resume both redirect here the instant belt_running
  // flips true, which can be well before the backend's wake-up sequence
  // actually finishes (up to several seconds on a slow connection) -- so the
  // buttons need to stay disabled/dim until belt_transitioning clears, not
  // just during the on-submit window.
  var actionButtons = document.querySelectorAll('button[type="submit"]');
  disableButtonsOnSubmit('transitioning-hint', actionButtons);

  startStatsStream(function(data) {
    setTransitioning('transitioning-hint', actionButtons, data.belt_transitioning === true);
    // Check if the server has auto-paused the session
    if (data.is_running === false) {
      window.location.reload();
    } else {
      setStatValue(document.getElementById('time_active'), data.time_active);
      setStatValue(document.getElementById('speed'), data.speed.toFixed(1));
      setStatValue(document.getElementById('distance'), data.distance.toFixed(2) + ' mi');
      setStatValue(document.getElementById('steps'), String(parseInt(data.steps, 10)));
      setStatValue(document.getElementById('calories'), data.calories.toFixed(0));
    }
  });
</script>

{% endblock %}
