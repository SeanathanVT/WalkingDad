<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
    // THEME_FONT_URLS is the single source of truth for special-theme fonts —
    // declared here, outside the IIFE below, so it's a true global that the
    // fuller color-theme picker logic further down this file can reference
    // too (its COLOR_THEMES entries set fontsUrl: THEME_FONT_URLS.<id>
    // instead of repeating the URL), rather than keeping two copies in sync
    // by convention.
    var THEME_FONT_URLS = {
        vt: 'https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Crimson+Text:wght@400;600;700&display=swap',
        harvest: 'https://fonts.googleapis.com/css2?family=Rye&family=Creepster&display=swap',
        frost: 'https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap',
        bloom: 'https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap',
        tide: 'https://fonts.googleapis.com/css2?family=Pacifico&display=swap'
    };
    // Same reasoning as THEME_FONT_URLS above: declared here (not inside the
    // color-theme IIFE further down) so this early-paint check and the
    // fuller picker logic's own init/popover-building code share one array
    // instead of this script hand-maintaining a separate id list that could
    // drift out of sync with it.
    var COLOR_THEMES = [
        // Slate first -- it's the default (absence of data-color-theme).
        // The rest run in hue order (ROYGBIV-style spectral sweep, see
        // the CSS comment above the Red block) so adjacent swatches are
        // always visually distinct rather than clustered by coincidence.
        { id: 'slate', label: 'Slate', swatch: '#404040' },
        { id: 'red', label: 'Red', swatch: '#850c0c' },
        { id: 'amber', label: 'Amber', swatch: '#855d0c' },
        { id: 'lime', label: 'Lime', swatch: '#557a0b' },
        { id: 'forest', label: 'Forest', swatch: '#0c850c' },
        { id: 'teal', label: 'Teal', swatch: '#0c855d' },
        { id: 'cyan', label: 'Cyan', swatch: '#0c5d85' },
        { id: 'blue', label: 'Blue', swatch: '#0c0c85' },
        { id: 'violet', label: 'Violet', swatch: '#5d0c85' },
        { id: 'pink', label: 'Pink', swatch: '#850c5d' },
        // "Special" themes (e.g. brand/spirit-inspired) render in their own
        // labeled group below the standard palette. Add more here.
        {
            id: 'vt', label: 'Virginia Tech', swatch: '#861f41', special: true,
            swatchSplit: ['#861f41', '#e5751f'], // Chicago Maroon / Burnt Orange
            // Rubik + Crimson Text, Google Fonts substitutes for VT's licensed
            // Acherus Grotesque/Gineso — see the CSS comment above [data-color-theme="vt"].
            // Only fetched if this theme is actually selected. Sourced from
            // THEME_FONT_URLS (declared above) so there's one copy of each
            // URL, not two kept in sync by hand.
            fontsUrl: THEME_FONT_URLS.vt
        },
        // Seasonal themes, in calendar order: Bloom (spring) → Tide
        // (summer) → Harvest (fall) → Frost (winter).
        {
            id: 'bloom', label: 'Bloom', swatch: '#118721', special: true,
            swatchSplit: ['#8bda95', '#ea9ac2'], // pastel green / pastel pink — icon only, softer than the functional accent
            fontsUrl: THEME_FONT_URLS.bloom
        },
        {
            id: 'tide', label: 'Tide', swatch: '#11818c', special: true,
            swatchSplit: ['#11818c', '#d9b876'], // turquoise water / sand
            fontsUrl: THEME_FONT_URLS.tide
        },
        {
            id: 'harvest', label: 'Harvest', swatch: '#c2410c', special: true,
            swatchSplit: ['#c2410c', '#7a4b29'], // pumpkin orange / hay brown — icon reads harvest, not black-cauldron Halloween
            // Rye for light mode (autumnal), Creepster for dark mode
            // (spooky) — both loaded together so a later mode toggle
            // never needs a fresh font fetch.
            fontsUrl: THEME_FONT_URLS.harvest
        },
        {
            id: 'frost', label: 'Frost', swatch: '#b91c1c', special: true,
            swatchSplit: ['#b91c1c', '#166534'], // berry red / evergreen
            fontsUrl: THEME_FONT_URLS.frost
        }
    ];
    // Applies the stored theme (and any theme-specific font) before first
    // paint, so navigating to a new page doesn't flash the :root (Slate/Light,
    // default-font) state first. Intentionally standalone/duplicated from the
    // fuller theme logic further down this file — must run synchronously,
    // before anything else, with no dependency on DOM elements that don't
    // exist yet.
    (function() {
        var root = document.documentElement;
        var mode = localStorage.getItem('walkingpad-theme');
        var isDark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) root.setAttribute('data-theme', 'dark');

        var colorTheme = localStorage.getItem('walkingpad-color-theme');
        if (colorTheme && COLOR_THEMES.some(function(t) { return t.id === colorTheme; })) {
            root.setAttribute('data-color-theme', colorTheme);
            if (THEME_FONT_URLS[colorTheme]) {
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = THEME_FONT_URLS[colorTheme];
                document.head.appendChild(link);
            }
        }
        // Stale ids (colorTheme set but not recognized) are left unset here,
        // matching :root's Slate defaults with no flash -- the fuller picker
        // logic below also clears the stale localStorage key on next init.
    })();
    </script>
    <title>WalkingDad</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?display=swap&family=Noto+Sans:wght@400;500;700;900&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700">

    <style>
        /* Custom properties from the design file */
        /* Slate is the default (absence of data-color-theme, same
           optimization the picker already used for the old default) —
           these neutrals are Tailwind's slate-50/900 scale, unchanged from
           before this was Slate's identity; only the accent moved from
           blue to gray. */
        :root {
            --background-color: #f8fafc; /* bg-slate-50 */
            --card-color: #e7edf4;
            --text-color: #0d141c;
            --border-color: #e7edf4;
            --header-bg: white;
            --button-hover-bg: #d8e0ea;
            --muted-color: #6c757d;

            --accent-color: #404040;
            --accent-hover: #262626;

            --font-heading: "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
            --font-body: "Noto Sans", "IBM Plex Sans Condensed", sans-serif;
            /* Instrument face — stat readouts, data labels, connection status.
               Constant across every color theme, the way a speedometer's face
               doesn't change with the car's paint color. */
            --font-mono: "JetBrains Mono", "Space Mono", ui-monospace, monospace;
        }

        /* Dark mode overrides */
        [data-theme="dark"] {
            --background-color: #0f172a; /* slate-900 */
            --card-color: #1e293b; /* slate-800 */
            --text-color: #f1f5f9; /* slate-100 */
            --border-color: #334155; /* slate-700 */
            --header-bg: #1e293b; /* slate-800 */
            --button-hover-bg: #334155; /* slate-700 */
            --muted-color: #94a3b8; /* slate-400 */

            --accent-color: #737373;
            --accent-hover: #8d8d8d;
        }

        /* The 9 hued standard themes below are generated from one formula
           (constant S/L per token, hue swept in even 40° steps: Red 0° ->
           Pink 320°) so every option reads as equally distinct in the
           picker — the previous ad-hoc hues clustered 5 cool colors
           (Teal/Cyan/Blue/Indigo/Violet) into an 89° span while leaving a
           76° gap where red belongs. Each accent is contrast-checked at
           >=4.5:1 against white button text. */

        /* Color theme: Red (0°) */
        [data-color-theme="red"] {
            --background-color: #faf4f4;
            --card-color: #f2e5e5;
            --text-color: #1a0e0e;
            --border-color: #e8d4d4;
            --header-bg: #faf4f4;
            --button-hover-bg: #e5d1d1;
            --muted-color: #785e5e;

            --accent-color: #850c0c;
            --accent-hover: #690909;
        }
        [data-theme="dark"][data-color-theme="red"] {
            --background-color: #150a0a;
            --card-color: #251313;
            --text-color: #f7eeee;
            --border-color: #3f2222;
            --header-bg: #251313;
            --button-hover-bg: #3f2222;
            --muted-color: #a98f8f;

            --accent-color: #831b1b;
            --accent-hover: #a81e1e;
        }

        /* Color theme: Amber (40°) */
        [data-color-theme="amber"] {
            --background-color: #faf8f4;
            --card-color: #f2ede5;
            --text-color: #1a160e;
            --border-color: #e8e1d4;
            --header-bg: #faf8f4;
            --button-hover-bg: #e5dfd1;
            --muted-color: #78705e;

            --accent-color: #855d0c;
            --accent-hover: #694909;
        }
        [data-theme="dark"][data-color-theme="amber"] {
            --background-color: #15120a;
            --card-color: #251f13;
            --text-color: #f7f4ee;
            --border-color: #3f3622;
            --header-bg: #251f13;
            --button-hover-bg: #3f3622;
            --muted-color: #a9a08f;

            --accent-color: #83601b;
            --accent-hover: #a87a1e;
        }

        /* Color theme: Lime (80°) — accent lightness nudged darker than the
           formula default (L26/28 vs the usual L28/31) since the formula
           value fell just under 4.5:1 white-text contrast at this hue. */
        [data-color-theme="lime"] {
            --background-color: #f8faf4;
            --card-color: #edf2e5;
            --text-color: #161a0e;
            --border-color: #e1e8d4;
            --header-bg: #f8faf4;
            --button-hover-bg: #dfe5d1;
            --muted-color: #70785e;

            --accent-color: #557a0b;
            --accent-hover: #415e08;
        }
        [data-theme="dark"][data-color-theme="lime"] {
            --background-color: #12150a;
            --card-color: #1f2513;
            --text-color: #f4f7ee;
            --border-color: #363f22;
            --header-bg: #1f2513;
            --button-hover-bg: #363f22;
            --muted-color: #a0a98f;

            --accent-color: #567418;
            --accent-hover: #7aa81e;
        }

        /* Color theme: Forest (120°) */
        [data-color-theme="forest"] {
            --background-color: #f4faf4;
            --card-color: #e5f2e5;
            --text-color: #0e1a0e;
            --border-color: #d4e8d4;
            --header-bg: #f4faf4;
            --button-hover-bg: #d1e5d1;
            --muted-color: #5e785e;

            --accent-color: #0c850c;
            --accent-hover: #096909;
        }
        [data-theme="dark"][data-color-theme="forest"] {
            --background-color: #0a150a;
            --card-color: #132513;
            --text-color: #eef7ee;
            --border-color: #223f22;
            --header-bg: #132513;
            --button-hover-bg: #223f22;
            --muted-color: #8fa98f;

            --accent-color: #1b831b;
            --accent-hover: #1ea81e;
        }

        /* Color theme: Teal (160°) — tints the neutral surfaces too, not
           just the accent, so the theme reads as distinct rather than
           "gray app with a teal button" (same for every hued theme below). */
        [data-color-theme="teal"] {
            --background-color: #f4faf8;
            --card-color: #e5f2ed;
            --text-color: #0e1a16;
            --border-color: #d4e8e1;
            --header-bg: #f4faf8;
            --button-hover-bg: #d1e5df;
            --muted-color: #5e7870;

            --accent-color: #0c855d;
            --accent-hover: #096949;
        }
        [data-theme="dark"][data-color-theme="teal"] {
            --background-color: #0a1512;
            --card-color: #13251f;
            --text-color: #eef7f4;
            --border-color: #223f36;
            --header-bg: #13251f;
            --button-hover-bg: #223f36;
            --muted-color: #8fa9a0;

            --accent-color: #1b8360;
            --accent-hover: #1ea87a;
        }

        /* Color theme: Cyan (200°) */
        [data-color-theme="cyan"] {
            --background-color: #f4f8fa;
            --card-color: #e5edf2;
            --text-color: #0e161a;
            --border-color: #d4e1e8;
            --header-bg: #f4f8fa;
            --button-hover-bg: #d1dfe5;
            --muted-color: #5e7078;

            --accent-color: #0c5d85;
            --accent-hover: #094969;
        }
        [data-theme="dark"][data-color-theme="cyan"] {
            --background-color: #0a1215;
            --card-color: #131f25;
            --text-color: #eef4f7;
            --border-color: #22363f;
            --header-bg: #131f25;
            --button-hover-bg: #22363f;
            --muted-color: #8fa0a9;

            --accent-color: #1b6083;
            --accent-hover: #1e7aa8;
        }

        /* Color theme: Blue (240°) — no longer the implicit default (Slate
           is now); this is a full explicit override like every other hue. */
        [data-color-theme="blue"] {
            --background-color: #f4f4fa;
            --card-color: #e5e5f2;
            --text-color: #0e0e1a;
            --border-color: #d4d4e8;
            --header-bg: #f4f4fa;
            --button-hover-bg: #d1d1e5;
            --muted-color: #5e5e78;

            --accent-color: #0c0c85;
            --accent-hover: #090969;
        }
        [data-theme="dark"][data-color-theme="blue"] {
            --background-color: #0a0a15;
            --card-color: #131325;
            --text-color: #eeeef7;
            --border-color: #22223f;
            --header-bg: #131325;
            --button-hover-bg: #22223f;
            --muted-color: #8f8fa9;

            --accent-color: #1b1b83;
            --accent-hover: #1e1ea8;
        }

        /* Color theme: Violet (280°) — stands in for both Indigo and Violet;
           the two are only ~20° apart in real color theory and read as
           near-duplicates at swatch size, so this palette keeps one. */
        [data-color-theme="violet"] {
            --background-color: #f8f4fa;
            --card-color: #ede5f2;
            --text-color: #160e1a;
            --border-color: #e1d4e8;
            --header-bg: #f8f4fa;
            --button-hover-bg: #dfd1e5;
            --muted-color: #705e78;

            --accent-color: #5d0c85;
            --accent-hover: #490969;
        }
        [data-theme="dark"][data-color-theme="violet"] {
            --background-color: #120a15;
            --card-color: #1f1325;
            --text-color: #f4eef7;
            --border-color: #36223f;
            --header-bg: #1f1325;
            --button-hover-bg: #36223f;
            --muted-color: #a08fa9;

            --accent-color: #601b83;
            --accent-hover: #7a1ea8;
        }

        /* Color theme: Pink (320°) */
        [data-color-theme="pink"] {
            --background-color: #faf4f8;
            --card-color: #f2e5ed;
            --text-color: #1a0e16;
            --border-color: #e8d4e1;
            --header-bg: #faf4f8;
            --button-hover-bg: #e5d1df;
            --muted-color: #785e70;

            --accent-color: #850c5d;
            --accent-hover: #690949;
        }
        [data-theme="dark"][data-color-theme="pink"] {
            --background-color: #150a12;
            --card-color: #25131f;
            --text-color: #f7eef4;
            --border-color: #3f2236;
            --header-bg: #25131f;
            --button-hover-bg: #3f2236;
            --muted-color: #a98fa0;

            --accent-color: #831b60;
            --accent-hover: #a81e7a;
        }

        /* Special theme: Virginia Tech — official brand colors, verified
           directly against VT's own production CSS custom properties
           (--vt-maroon, --vt-impactOrange, --vt-hokieStone, --vt-grey,
           --vt-smoke, --vt-white), not just the brand-guide description.
           VT's own guidelines forbid lightening/tinting Maroon or Burnt
           Orange (shading only), so the accent is identical in light and
           dark mode; only the neutral surfaces — now VT's actual secondary
           palette (Grey/Smoke/White), not an approximation — invert. */
        [data-color-theme="vt"] {
            --background-color: #ffffff; /* --vt-white */
            --card-color: #e5e1e6; /* --vt-smoke */
            --text-color: #0c0c0c;
            --border-color: #d7d2cb; /* --vt-grey */
            --header-bg: #ffffff; /* --vt-white */
            --button-hover-bg: #c1b9ae; /* darkened --vt-grey */
            --muted-color: #75787b; /* --vt-hokieStone */

            --accent-color: #861f41; /* --vt-maroon */
            --accent-hover: #ca4f00; /* --vt-impactOrange */

            /* VT's primary typeface (Acherus Grotesque) and display face
               (Gineso) are licensed and not freely distributable. VT's own
               typography guide names Rubik as an acceptable substitute for
               Acherus in headlines, and Crimson Text as their chosen Google
               Font for body copy — both loaded from Google Fonts, same as
               this app's default fonts. Arial is VT's own stated fallback
               for whenever a brand font is unavailable (ahead of this app's
               own generic fallback, kept as a last resort). */
            --font-heading: "Rubik", Arial, "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
            --font-body: "Crimson Text", Georgia, serif;
            /* "Acherus Grotesque requires slightly tighter tracking than
               default" per VT's typography guide -- carried over to Rubik
               since it stands in for Acherus here. */
            --font-heading-letter-spacing: -0.015em;
        }
        [data-theme="dark"][data-color-theme="vt"] {
            --background-color: #171819;
            --card-color: #232425;
            --text-color: #f1f1f2;
            --border-color: #3b3c3e;
            --header-bg: #232425;
            --button-hover-bg: #3b3c3e;
            --muted-color: #9fa1a3;

            --accent-color: #861f41;
            --accent-hover: #ca4f00;

            --font-heading: "Rubik", Arial, "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
            --font-body: "Crimson Text", Georgia, serif;
            --font-heading-letter-spacing: -0.015em;
        }

        /* Seasonal themes, in calendar order: Bloom (spring) → Tide (summer)
           → Harvest (fall) → Frost (winter). */

        /* Special theme: Bloom — grass green + blossom pink, yellow-green neutrals */
        [data-color-theme="bloom"] {
            --background-color: #f7faf4;
            --card-color: #eaf1e4;
            --text-color: #131b0e;
            --border-color: #dce8d4;
            --header-bg: #f7faf4;
            --button-hover-bg: #dae6d1;
            --muted-color: #69785e;

            --accent-color: #118721;
            --accent-hover: #de1b7d;

            --font-heading: "Quicksand", "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
        }
        [data-theme="dark"][data-color-theme="bloom"] {
            --background-color: #0e1509;
            --card-color: #1b2513;
            --text-color: #f1f7ee;
            --border-color: #2e3f22;
            --header-bg: #1b2513;
            --button-hover-bg: #2e3f22;
            --muted-color: #99a88f;

            --accent-color: #1c872a;
            --accent-hover: #d42f82;

            --font-heading: "Quicksand", "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
        }

        /* Special theme: Tide — turquoise + coral, sandy neutrals */
        [data-color-theme="tide"] {
            --background-color: #faf9f4;
            --card-color: #f1ede4;
            --text-color: #1b170e;
            --border-color: #e8e2d4;
            --header-bg: #faf9f4;
            --button-hover-bg: #e6dfd1;
            --muted-color: #78705e;

            --accent-color: #11818c;
            --accent-hover: #d1441a;

            /* Pacifico only ships a regular weight — forcing bold on it
               triggers synthetic faux-bold, which distorts the strokes. */
            --font-heading: "Pacifico", "IBM Plex Sans Condensed", "Noto Sans", cursive;
            --font-heading-weight: 400;
        }
        [data-theme="dark"][data-color-theme="tide"] {
            --background-color: #151209;
            --card-color: #252013;
            --text-color: #f7f4ee;
            --border-color: #3f3622;
            --header-bg: #252013;
            --button-hover-bg: #3f3622;
            --muted-color: #a8a18f;

            --accent-color: #1c818b;
            --accent-hover: #c74e29;

            --font-heading: "Pacifico", "IBM Plex Sans Condensed", "Noto Sans", cursive;
            --font-heading-weight: 400;
        }

        /* Special theme: Harvest — pumpkin orange + witch purple (Halloween-
           inspired, kept generic since it's mode-aware: cozy/autumnal in
           light mode (Rye, falling leaves), spooky in dark mode (Creepster,
           glowing eyes) — see the ambient-effects section further down and
           renderThemeFx()/the .theme-fx-eyes rule). */
        [data-color-theme="harvest"] {
            --background-color: #fdf6ec;
            --card-color: #f5e6cc;
            --text-color: #1f130a;
            --border-color: #e8d3a0;
            --header-bg: #fffaf0;
            --button-hover-bg: #efd9ab;
            --muted-color: #8a6d3f;

            /* Orange/gold/brown — harvest colors, no purple. Dark mode below
               is where this theme is allowed to read as Halloween. */
            --accent-color: #c2410c;
            --accent-hover: #b45309;

            /* Body text stays the default sans — only headings get the
               display treatment, so section titles/numbers stay legible. */
            --font-heading: "Rye", "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
        }
        [data-theme="dark"][data-color-theme="harvest"] {
            --background-color: #0d0704;
            --card-color: #1a1006;
            --text-color: #f7ecd8;
            --border-color: #3a2510;
            --header-bg: #1a1006;
            --button-hover-bg: #3a2510;
            --muted-color: #b89a6a;

            --accent-color: #c2410c;
            --accent-hover: #9333ea;

            --font-heading: "Creepster", "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
        }

        /* Special theme: Frost — evergreen + berry red (Christmas-inspired) */
        [data-color-theme="frost"] {
            --background-color: #f8faf9;
            --card-color: #eef5f0;
            --text-color: #0d1a12;
            --border-color: #d8e8dd;
            --header-bg: #ffffff;
            --button-hover-bg: #d3e6da;
            --muted-color: #5f7868;

            --accent-color: #b91c1c;
            --accent-hover: #166534;

            --font-heading: "Mountains of Christmas", "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
        }
        [data-theme="dark"][data-color-theme="frost"] {
            --background-color: #050f08;
            --card-color: #0d1f13;
            --text-color: #eef7f1;
            --border-color: #1f3d29;
            --header-bg: #0d1f13;
            --button-hover-bg: #1f3d29;
            --muted-color: #8fa899;

            --accent-color: #dc2626;
            --accent-hover: #15803d;

            --font-heading: "Mountains of Christmas", "IBM Plex Sans Condensed", "Noto Sans", sans-serif;
        }

        /* Future color themes follow the same pattern: one light block + one
           [data-theme="dark"][data-color-theme="X"] block, tinting both the
           neutral surfaces and the accent. No JS/HTML changes needed. */

        body {
            font-family: var(--font-body);
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        h1, h2, h3, .navbar-brand, .content-title {
            font-family: var(--font-heading);
            letter-spacing: var(--font-heading-letter-spacing, normal);
        }

        /* Header styles */
        .app-header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .app-header .navbar-brand {
            /* var(), not a hardcoded 700: Tide's Pacifico only ships a
               regular weight — forcing bold on it triggers ugly synthetic/
               faux-bold rendering. */
            font-weight: var(--font-heading-weight, 700);
            font-size: 1.25rem;
            color: var(--text-color);
        }

        /* Header buttons and indicator */
        .btn-header-close {
            background-color: var(--card-color);
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.9rem;
            border: none;
            padding: 0.3rem 0.8rem;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .btn-header-close:hover {
            background-color: var(--button-hover-bg);
            color: var(--text-color);
        }

        /* Theme toggle button */
        .btn-theme-toggle {
            background-color: var(--card-color);
            color: var(--text-color);
            font-weight: 500;
            font-size: 1rem;
            border: none;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .btn-theme-toggle:hover {
            background-color: var(--button-hover-bg);
            color: var(--text-color);
        }

        /* Color theme picker */
        .color-theme-picker {
            position: relative;
        }
        .color-theme-popover {
            display: none;
            position: absolute;
            top: calc(100% + 0.4rem);
            right: 0;
            z-index: 1050;
            width: 11rem;
            background-color: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.5rem;
            gap: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .color-theme-popover.show {
            display: flex;
            flex-wrap: wrap;
        }
        .color-swatch {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            cursor: pointer;
            padding: 0;
            transition: transform 0.1s ease, border-color 0.2s ease;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.is-active {
            border-color: var(--text-color);
        }
        .color-swatch:focus-visible {
            outline: 2px solid var(--text-color);
            outline-offset: 2px;
        }
        .color-theme-popover-divider {
            flex-basis: 100%;
            border-top: 1px solid var(--border-color);
            margin-top: 0.2rem;
            padding-top: 0.4rem;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted-color);
        }

        /* Comma separator between header controls */
        .header-separator {
            color: var(--border-color);
            user-select: none;
        }

        /* Main content styles */
        .content-title {
            font-size: 2rem;
            font-weight: var(--font-heading-weight, 700);
        }

        .stat-card {
            background-color: var(--card-color);
            padding: 1.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s ease;
        }

        /* Console readout — the live-telemetry hero + secondary instrument
           strip used on the Start/Active/Paused screens, standing in for the
           WalkingPad's own onboard display. Inset shadow suggests a display
           cut into the panel rather than a card sitting on top of it. */
        .console-hero {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem 1.5rem;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.12), inset 0 -1px 0 rgba(255, 255, 255, 0.04);
        }

        .console-hero-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted-color);
        }

        /* Status word (Connecting/Connection Failed/Disconnected) -- a
           smaller, single-line sibling of .console-hero-value for screens
           that report a state rather than a live numeric reading. */
        .console-hero-status {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }

        .console-hero-value {
            font-family: var(--font-mono);
            font-size: clamp(3.5rem, 12vw, 5.5rem);
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
        }
        .console-hero-value.is-time {
            /* Time strings run longer ("1:04:22") than a speed reading —
               a smaller ceiling keeps them from overflowing narrow screens. */
            font-size: clamp(2.25rem, 9vw, 3.5rem);
        }

        .console-hero-unit {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--muted-color);
            margin-left: 0.4rem;
        }

        .console-hero-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            margin-top: 0.5rem;
        }

        .stepper-btn {
            width: 3rem;
            height: 3rem;
            flex: none;
            border-radius: 50%;
            border: none;
            background-color: var(--button-hover-bg);
            color: var(--text-color);
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .stepper-btn:hover {
            background-color: var(--accent-color);
            color: white;
        }
        .stepper-btn:active {
            transform: scale(0.92);
        }
        .stepper-btn:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .console-engage-btn {
            width: 8rem;
            height: 8rem;
            border-radius: 50%;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.15);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .console-engage-btn i {
            font-size: 1.75rem;
        }
        .console-engage-btn:hover {
            background-color: var(--accent-hover);
        }
        .console-engage-btn:active {
            transform: scale(0.96);
        }
        .console-engage-btn:focus-visible {
            outline: 2px solid var(--text-color);
            outline-offset: 3px;
        }

        .console-strip {
            display: flex;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .console-strip-item {
            flex: 1 1 0;
            min-width: 5.5rem;
            text-align: center;
            padding: 0.9rem 0.5rem;
            background-color: var(--card-color);
            border-right: 1px solid var(--border-color);
        }
        .console-strip-item:last-child {
            border-right: none;
        }
        @media (max-width: 480px) {
            /* Grid instead of flex-wrap: dividers come from the gap showing
               the container's own background through, so they only ever
               appear between two real cells -- a flex+border-right/bottom
               approach can't distinguish "last row" from "any row" or handle
               an odd item count (a lone trailing item) without per-item
               bookkeeping the template doesn't have. */
            .console-strip {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1px;
                background-color: var(--border-color);
            }
            .console-strip-item {
                border-right: none;
            }
            .console-strip-item:last-child:nth-child(odd) {
                /* Lone leftover item (odd total count, e.g. Paused's 3-item
                   strip) spans both columns instead of leaving an empty
                   cell with a dangling divider next to it. */
                grid-column: 1 / -1;
            }
        }
        .console-strip-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted-color);
            margin-bottom: 0.3rem;
        }
        .console-strip-value {
            font-family: var(--font-mono);
            font-size: 1.15rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
        }

        /* Preset chips (Slow/Moderate/Max) — text-only, deliberately
           icon-free so the icons on Pause/Resume/End keep their signal value. */
        .btn-preset {
            background-color: var(--card-color);
            color: var(--text-color);
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.25rem;
        }
        .btn-preset:hover {
            background-color: var(--button-hover-bg);
            color: var(--text-color);
        }

        /* Odometer-style tick on a value change — a quick mechanical roll
           rather than an instant text swap. Triggered via the shared
           setStatValue() helper. */
        @keyframes console-tick {
            0%   { transform: translateY(0); opacity: 1; }
            30%  { transform: translateY(-0.35em); opacity: 0.4; }
            31%  { transform: translateY(0.35em); }
            100% { transform: translateY(0); opacity: 1; }
        }
        .console-hero-value.tick,
        .console-strip-value.tick {
            animation: console-tick 0.35s ease-out;
        }

        /* Status LED — connection state as a small glowing dot instead of an
           icon + colored text, matching the instrument-panel language above. */
        .connection-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted-color);
        }
        .status-led {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background-color: var(--muted-color);
        }
        .connection-indicator[data-status="connected"] .status-led {
            background-color: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }
        .connection-indicator[data-status="connecting"] .status-led {
            background-color: #f59e0b;
            box-shadow: 0 0 6px #f59e0b;
            animation: status-pulse 1.4s ease-in-out infinite;
        }
        .connection-indicator[data-status="disconnected"] .status-led {
            background-color: #ef4444;
            box-shadow: 0 0 6px #ef4444;
        }
        @keyframes status-pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }

        /* Custom button styles */
        .btn-custom-primary {
            background-color: var(--accent-color);
            color: white;
            font-weight: 700;
            padding: 0.75rem 2rem;
        }
        .btn-custom-primary:hover {
            background-color: var(--accent-hover);
            color: white;
        }

        /* Accent-colored text/spinners (Bootstrap's .text-primary is a fixed
           color and doesn't follow the color theme) */
        .text-accent {
            color: var(--accent-color) !important;
        }

        /* Override Bootstrap's .text-muted for dark mode readability */
        .text-muted {
            color: var(--muted-color) !important;
        }

        /* Danger / End Session button */
        .btn-custom-danger {
            background-color: #dc3545;
            color: white;
            font-weight: 700;
            padding: 0.75rem 2rem;
        }
        .btn-custom-danger:hover {
            background-color: #bb2d3b;
            color: white;
        }
        [data-theme="dark"] .btn-custom-danger {
            background-color: #e46071;
        }
        [data-theme="dark"] .btn-custom-danger:hover {
            background-color: #dc3545;
        }

        /* History table — fully custom, no Bootstrap .table dependency */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-color);
            color: var(--text-color);
        }
        .history-table thead tr {
            background-color: var(--border-color);
        }
        .history-table th,
        .history-table td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }
        .history-table th {
            font-weight: 600;
        }
        .history-table tbody tr {
            background-color: var(--card-color);
        }
        .history-table tbody tr:hover {
            background-color: var(--button-hover-bg);
        }
        .history-table .mono-num {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        /* Settings form fields -- shared by every input/hint/section title
           instead of repeating the same inline style per field. */
        .settings-input {
            background-color: var(--background-color);
            color: var(--text-color);
            border-color: var(--border-color);
        }
        .settings-hint {
            font-family: var(--font-mono);
        }
        .settings-section-title {
            font-size: 1.1rem;
            font-weight: var(--font-heading-weight, 700);
            margin-bottom: 1rem;
        }

        /* Special-theme ambient effects (falling snow for Frost).
           Fixed, full-viewport, non-interactive — particles are populated by
           renderThemeFx() further down this file. */
        .theme-fx-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }
        .theme-fx-particle {
            position: absolute;
            will-change: transform, opacity;
        }
        @media (prefers-reduced-motion: reduce) {
            .theme-fx-layer,
            .theme-fx-eyes {
                display: none !important;
            }
            .status-led,
            .console-hero-value,
            .console-strip-value {
                animation: none !important;
            }
        }

        @keyframes theme-fx-snow-fall {
            from { transform: translate3d(0, -10vh, 0) rotate(0deg); }
            to   { transform: translate3d(var(--fx-drift, 20px), 115vh, 0) rotate(360deg); }
        }
        .theme-fx-particle.snow {
            top: 0;
            color: #eaf6ff;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.35);
            animation-name: theme-fx-snow-fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes theme-fx-crab-walk {
            from { transform: translate3d(-10vw, 0, 0); }
            to   { transform: translate3d(110vw, 0, 0); }
        }
        .theme-fx-particle.crab {
            left: 0;
            animation-name: theme-fx-crab-walk;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Harvest's dark-mode effect: glowing eyes in the dark — only
           shown in dark mode, since that's the whole premise (light mode
           gets falling leaves instead, via renderThemeFx() below). Each
           element holds still and visible for a
           stretch, fades out, silently "teleports" to a new spot while
           invisible (interpolating position during an opacity:0 window
           produces no visible motion), then fades back in — appearing to
           watch from a different spot in the shadows each time. */
        .theme-fx-eyes {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            font-size: 1.6rem;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            filter: drop-shadow(0 0 6px rgba(255, 205, 70, 0.9)) drop-shadow(0 0 10px rgba(255, 205, 70, 0.5));
            animation-name: theme-fx-eyes-appear;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            animation-duration: 24s;
        }
        [data-theme="dark"][data-color-theme="harvest"] .theme-fx-eyes {
            display: block;
        }
        @keyframes theme-fx-eyes-appear {
            0%   { opacity: 0; transform: translate3d(var(--fx-ex1), var(--fx-ey1), 0); }
            3%   { opacity: 1; transform: translate3d(var(--fx-ex1), var(--fx-ey1), 0); }
            14%  { opacity: 1; transform: translate3d(var(--fx-ex1), var(--fx-ey1), 0); }
            17%  { opacity: 0; transform: translate3d(var(--fx-ex1), var(--fx-ey1), 0); }
            18%  { opacity: 0; transform: translate3d(var(--fx-ex2), var(--fx-ey2), 0); }
            33%  { opacity: 1; transform: translate3d(var(--fx-ex2), var(--fx-ey2), 0); }
            44%  { opacity: 1; transform: translate3d(var(--fx-ex2), var(--fx-ey2), 0); }
            47%  { opacity: 0; transform: translate3d(var(--fx-ex2), var(--fx-ey2), 0); }
            48%  { opacity: 0; transform: translate3d(var(--fx-ex3), var(--fx-ey3), 0); }
            63%  { opacity: 1; transform: translate3d(var(--fx-ex3), var(--fx-ey3), 0); }
            74%  { opacity: 1; transform: translate3d(var(--fx-ex3), var(--fx-ey3), 0); }
            77%  { opacity: 0; transform: translate3d(var(--fx-ex3), var(--fx-ey3), 0); }
            78%  { opacity: 0; transform: translate3d(var(--fx-ex1), var(--fx-ey1), 0); }
            100% { opacity: 0; transform: translate3d(var(--fx-ex1), var(--fx-ey1), 0); }
        }

        /* Virginia Tech's accent devices — both sourced from VT's own
           "Design Elements" guide rather than invented: square dots ("can
           be used... to call attention to numbers, section types"), applied
           to every stat label since this whole app is numbers/section
           labels, and a detail line ("never thicker than 2 points... rarely
           used as decoration"), a two-tone maroon/orange rule under the
           header and above the instrument strip. Colors are hardcoded (not
           var(--accent-color)): this pairing only reads as "VT" in exactly
           these two hues, the same reason .btn-custom-danger ignores the
           theme accent. Static, no motion — an earlier animated stripe-bar
           version read as too loud and was dropped in favor of this. */
        [data-color-theme="vt"] .console-hero-label::before,
        [data-color-theme="vt"] .console-strip-label::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 0.45em;
            margin-bottom: 1px;
            background: #e5751f;
            vertical-align: middle;
        }
        /* Only reaches Settings' <h1> and the conditional "Recent Sessions"
           <h2> -- Active/Paused/Start's own page headings are
           visually-hidden for accessibility (see those templates), so this
           never renders there. The small dot on .console-hero-label above
           is what actually shows as this app's "page title" accent on
           those three screens. */
        [data-color-theme="vt"] .content-title::before {
            content: '';
            display: inline-block;
            width: 9px;
            height: 9px;
            margin-right: 0.5em;
            margin-bottom: 2px;
            background: #861f41;
            vertical-align: middle;
        }
        [data-color-theme="vt"] .app-header {
            /* No position:relative needed for the ::after below -- .app-header
               already carries Bootstrap's .sticky-top (position:sticky), which
               is an equally valid containing block for an absolute child. */
            border-bottom: none;
        }
        [data-color-theme="vt"] .app-header::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: linear-gradient(to right, #861f41 0 70%, #e5751f 70% 100%);
        }
        [data-color-theme="vt"] .console-strip {
            position: relative;
            margin-top: 2rem;
        }
        [data-color-theme="vt"] .console-strip::before {
            content: '';
            position: absolute;
            top: -0.75rem;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, #861f41 0 70%, #e5751f 70% 100%);
        }
    </style>

    <span class="theme-fx-eyes" style="--fx-ex1:50vw; --fx-ey1:75vh; --fx-ex2:20vw; --fx-ey2:35vh; --fx-ex3:80vw; --fx-ey3:65vh; animation-delay:-12s;" aria-hidden="true">👀</span>
    <span class="theme-fx-eyes" style="--fx-ex1:30vw; --fx-ey1:55vh; --fx-ex2:65vw; --fx-ey2:15vh; --fx-ex3:10vw; --fx-ey3:80vh; animation-delay:-18s;" aria-hidden="true">👀</span>
    <script>

    // call this synchronously the moment their own inline <script> runs,
    // instead of waiting for scripts later in the document (e.g.
    // showShutdownOverlay below) to have executed first.
    function startStatsStream(onMessage) {
        var shutdownShown = false;
        var es = new EventSource("{{ url_for('stats_stream') }}");
        es.onmessage = function(event) {
            var data = JSON.parse(event.data);
            if (data.stopping === true && !shutdownShown) {
                shutdownShown = true;
                showShutdownOverlay();
                es.close();
                return;
            }
            if (data.is_connected === false) {
                window.location.reload();
                return;
            }
            onMessage(data);
        };
        es.onerror = function() {
            // The browser retries automatically on a transient drop; this is
            // just for visibility so a stuck/failing stream isn't silently
            // invisible in the console while debugging a "not updating" report.
            console.warn('Stats stream connection error (browser will auto-retry).');
        };
    }

    // Updates a console readout and plays the odometer-tick animation, but
    // only when the value actually changed (SSE ticks arrive every second
    // regardless of whether any stat moved).
    function setStatValue(el, text) {
        if (!el || el.textContent === text) return;
        el.textContent = text;
        el.classList.remove('tick');
        void el.offsetWidth; // Force reflow so a rapid re-trigger still restarts the animation.
        el.classList.add('tick');
    }

    // Toggles a "<verb> belt..." hint and disables/dims the buttons that
    // shouldn't be double-tapped while a belt sequence is in flight. Shared
    // by active/paused/start, which each pass their own hint id and button set.
    function setTransitioning(hintId, buttons, on) {
        var hint = document.getElementById(hintId);
        if (hint) hint.style.display = on ? '' : 'none';
        buttons.forEach(function(b) {
            b.disabled = on;
            b.style.opacity = on ? '0.5' : '';
        });
    }

    // Wires every form on the page to disable/dim `buttons` the instant any
    // of them is submitted -- the SSE-driven belt_transitioning update that
    // setTransitioning() above also responds to can lag behind by a full
    // network round-trip, leaving a window for a double-tap otherwise.
    function disableButtonsOnSubmit(hintId, buttons) {
        document.querySelectorAll('form').forEach(function(form) {
            form.addEventListener('submit', function() {
                setTransitioning(hintId, buttons, true);
            });
        });
    }
    </script>
    <header class="app-header sticky-top">
        <nav class="container-xl d-flex align-items-center justify-content-between py-3 px-4">
            <div class="d-flex align-items-center gap-3">
                <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('root') }}">
                    <i class="bi bi-person-walking"></i>
                    <span>WalkingDad</span>
                </a>

                {% set conn_status = 'Connected' if connected else ('Connecting' if connecting else 'Disconnected') %}
                <div class="connection-indicator" data-status="{{ conn_status|lower }}" aria-label="{{ conn_status }}">
                    <span class="status-led" aria-hidden="true"></span>
                    <span class="d-none d-md-inline" aria-hidden="true">{{ conn_status }}</span>
                </div>
            </div>

            <div class="d-flex align-items-center gap-1">
                <div class="color-theme-picker">
                    <button id="color-theme-toggle" class="btn btn-theme-toggle" title="Color theme" aria-haspopup="true" aria-expanded="false">
                        <i class="bi bi-palette2"></i>
                    </button>
                    <div id="color-theme-popover" class="color-theme-popover" role="menu"></div>
                </div>

                <button id="theme-toggle" class="btn btn-theme-toggle" title="Toggle theme (Light / Dark / System)">
                    <i class="bi bi-moon-fill" id="theme-icon"></i>
                </button>

                <a href="{{ url_for('settings_page') }}" class="btn btn-theme-toggle" title="Settings">
                    <i class="bi bi-gear-fill"></i>
                </a>
                <span class="header-separator px-2">|</span>

                <button id="shutdown-button" class="btn btn-header-close">Close</button>
            </div>
        </nav>
    </header>

    <main class="container-xl py-5">
        <div class="mx-auto" style="max-width: 960px;">
            {% block content %}{% endblock %}
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function showShutdownOverlay() {
        document.body.style.minHeight = '100vh';
        document.body.style.display = 'flex';
        document.body.style.flexDirection = 'column';
        document.body.style.justifyContent = 'center';
        document.body.style.alignItems = 'center';
        document.body.innerHTML = '<div class="container text-center"><h2>Server is shutting down. You may close this window.</h2></div>';
    }
    </script>
    <script>
    // Shared by both the mode toggle and the color-theme picker below, since
    // either one can change the resolved --header-bg.
    function updateThemeColorMeta() {
        var headerBg = getComputedStyle(document.documentElement).getPropertyValue('--header-bg').trim();
        if (!headerBg) return;
        // Safari only reliably samples this tag on initial load — mutating an
        // existing tag's `content` in place is silently ignored after that.
        // Removing and re-inserting a fresh element is the standard
        // workaround to force it to notice the change.
        var old = document.querySelector('meta[name="theme-color"]');
        if (old) old.remove();
        var meta = document.createElement('meta');
        meta.setAttribute('name', 'theme-color');
        meta.setAttribute('content', headerBg);
        document.head.appendChild(meta);
    }

    // Shared by Frost/Harvest/Bloom — all three are the same fall/drift/
    // rotate motion (the ".snow" class), differing only in glyphs/count/
    // size/duration.
    function spawnFallingParticles(layer, opts) {
        for (var i = 0; i < opts.count; i++) {
            var el = document.createElement('span');
            el.className = 'theme-fx-particle snow';
            el.textContent = opts.glyphs[i % opts.glyphs.length];
            el.style.left = (Math.random() * 100) + 'vw';
            el.style.fontSize = (opts.sizeMin + Math.random() * opts.sizeRange) + 'rem';
            el.style.opacity = (opts.opacityMin + Math.random() * opts.opacityRange).toFixed(2);
            el.style.setProperty('--fx-drift', (Math.random() * opts.driftRange - opts.driftRange / 2) + 'px');
            var duration = opts.durationMin + Math.random() * opts.durationRange;
            el.style.animationDuration = duration + 's';
            el.style.animationDelay = (-Math.random() * duration) + 's';
            layer.appendChild(el);
        }
    }

    // Shared by both the mode toggle and the color-theme picker, since
    // Harvest's effect depends on both (leaves in light mode, glowing eyes
    // in dark mode — eyes are pure CSS, gated by the same two attributes, so
    // only leaves need JS-generated particles here). Reads current state
    // directly off <html> rather than taking params, so either caller can
    // invoke it with no coordination needed.
    function renderThemeFx() {
        var layer = document.getElementById('theme-fx-layer');
        if (!layer) return;
        layer.innerHTML = '';
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) return;

        var colorTheme = document.documentElement.getAttribute('data-color-theme') || 'slate';
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';

        if (colorTheme === 'frost') {
            spawnFallingParticles(layer, {
                glyphs: ['❄', '❅', '❆'], count: 28,
                sizeMin: 0.7, sizeRange: 1.1, opacityMin: 0.45, opacityRange: 0.5,
                driftRange: 60, durationMin: 9, durationRange: 10
            });
        } else if (colorTheme === 'harvest' && !isDark) {
            // Dark mode gets glowing eyes instead (pure CSS, see .theme-fx-eyes).
            spawnFallingParticles(layer, {
                glyphs: ['🍂', '🍁'], count: 22,
                sizeMin: 0.9, sizeRange: 0.9, opacityMin: 0.55, opacityRange: 0.4,
                driftRange: 80, durationMin: 8, durationRange: 9
            });
        } else if (colorTheme === 'bloom') {
            spawnFallingParticles(layer, {
                glyphs: ['🌸', '🌸', '💮'], count: 24,
                sizeMin: 0.7, sizeRange: 0.8, opacityMin: 0.5, opacityRange: 0.45,
                driftRange: 90, durationMin: 10, durationRange: 10
            });
        } else if (colorTheme === 'tide') {
            var crabDirections = ['normal', 'reverse'];
            for (var c = 0; c < 8; c++) {
                var crab = document.createElement('span');
                crab.className = 'theme-fx-particle crab';
                crab.textContent = '🦀';
                crab.style.bottom = (Math.random() * 6) + 'vh';
                crab.style.fontSize = (1.1 + Math.random() * 0.7) + 'rem';
                crab.style.opacity = (0.6 + Math.random() * 0.35).toFixed(2);
                crab.style.animationDirection = crabDirections[c % 2];
                var crabDuration = 16 + Math.random() * 14;
                crab.style.animationDuration = crabDuration + 's';
                crab.style.animationDelay = (-Math.random() * crabDuration) + 's';
                layer.appendChild(crab);
            }
        }
    }

    // Dark Mode logic — three states: light, dark, system
    (function() {
        const root = document.documentElement;
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const STORAGE_KEY = 'walkingpad-theme';

        // Track the explicit mode separately from the applied visual theme
        var currentMode = 'system'; // default

        function getSystemPreference() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            updateThemeColorMeta();
            // renderThemeFx() is deliberately NOT called here — it would run
            // once from this function during initial page load and again a
            // moment later from applyColorTheme()'s own init call below,
            // rebuilding the same particles twice. Live mode changes (the
            // two call sites below) trigger it explicitly instead; the
            // single init call in the color-theme IIFE covers first paint,
            // by which point both data-theme and data-color-theme are
            // already set.
            // Only set icon if we are NOT in system mode (applyMode handles that)
            if (currentMode !== 'system') {
                if (theme === 'dark') {
                    themeIcon.className = 'bi bi-moon-fill';
                } else {
                    themeIcon.className = 'bi bi-sun-fill';
                }
            }
        }

        function applyMode(mode) {
            // mode: 'light' | 'dark' | 'system'
            currentMode = mode;
            if (mode === 'system') {
                localStorage.removeItem(STORAGE_KEY);
                themeIcon.className = 'bi bi-display-fill';
                applyTheme(getSystemPreference());
            } else {
                localStorage.setItem(STORAGE_KEY, mode);
                applyTheme(mode);
            }
        }

        // Initialize
        var savedMode = localStorage.getItem(STORAGE_KEY);
        applyMode(savedMode || 'system');

        // Cycle: light → dark → system → light ...
        toggleBtn.addEventListener('click', function() {
            if (currentMode === 'light') {
                applyMode('dark');
            } else if (currentMode === 'dark') {
                applyMode('system');
            } else {
                // system → light
                applyMode('light');
            }
            renderThemeFx();
        });

        // Listen for OS-level theme changes — only auto-follow in system mode
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (currentMode === 'system') {
                applyTheme(e.matches ? 'dark' : 'light');
                renderThemeFx();
            }
        });
    })();

    // Color theme logic — independent second axis (accent identity only)
    (function() {
        const root = document.documentElement;
        const COLOR_STORAGE_KEY = 'walkingpad-color-theme';
        // COLOR_THEMES itself is declared in the head-blocking script above
        // (a true global, same reasoning as THEME_FONT_URLS) so that script's
        // early-paint stale-id check and this popover-building code share it.

        const trigger = document.getElementById('color-theme-toggle');
        const popover = document.getElementById('color-theme-popover');

        function ensureThemeFontsLoaded(themeId) {
            var theme = COLOR_THEMES.find(function(t) { return t.id === themeId; });
            if (!theme || !theme.fontsUrl) return;
            // The head-of-document blocking script (see top of <head>) already
            // injects this link on initial page load to avoid a font flash;
            // don't fetch it twice.
            if (document.querySelector('link[href="' + theme.fontsUrl + '"]')) return;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = theme.fontsUrl;
            document.head.appendChild(link);
        }

        function applyColorTheme(themeId) {
            if (themeId === 'slate') {
                root.removeAttribute('data-color-theme'); // slate == absence, matches :root defaults
            } else {
                root.setAttribute('data-color-theme', themeId);
                ensureThemeFontsLoaded(themeId);
            }
            popover.querySelectorAll('[data-swatch-id]').forEach(function(el) {
                var active = el.getAttribute('data-swatch-id') === themeId;
                el.setAttribute('aria-checked', active ? 'true' : 'false');
                el.classList.toggle('is-active', active);
            });
            updateThemeColorMeta();
            renderThemeFx();
        }

        function setColorTheme(themeId) {
            if (themeId === 'slate') {
                localStorage.removeItem(COLOR_STORAGE_KEY);
            } else {
                localStorage.setItem(COLOR_STORAGE_KEY, themeId);
            }
            applyColorTheme(themeId);
        }

        function openPopover() {
            popover.classList.add('show');
            trigger.setAttribute('aria-expanded', 'true');
            document.addEventListener('click', onDocClick, true);
            document.addEventListener('keydown', onKeydown, true);
        }
        function closePopover() {
            popover.classList.remove('show');
            trigger.setAttribute('aria-expanded', 'false');
            document.removeEventListener('click', onDocClick, true);
            document.removeEventListener('keydown', onKeydown, true);
        }
        function onDocClick(e) {
            if (!popover.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) {
                closePopover();
            }
        }
        function onKeydown(e) {
            if (e.key === 'Escape') { closePopover(); trigger.focus(); }
        }

        var specialDividerAdded = false;
        COLOR_THEMES.forEach(function(t) {
            if (t.special && !specialDividerAdded) {
                var divider = document.createElement('span');
                divider.className = 'color-theme-popover-divider';
                divider.textContent = 'Special';
                popover.appendChild(divider);
                specialDividerAdded = true;
            }
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'color-swatch';
            btn.setAttribute('data-swatch-id', t.id);
            btn.setAttribute('role', 'menuitemradio');
            btn.setAttribute('aria-checked', 'false');
            btn.setAttribute('aria-label', t.label);
            btn.title = t.label;
            if (t.swatchSplit) {
                btn.style.background = 'linear-gradient(to bottom, ' + t.swatchSplit[0] + ' 50%, ' + t.swatchSplit[1] + ' 50%)';
            } else {
                btn.style.backgroundColor = t.swatch;
            }
            btn.addEventListener('click', function() {
                setColorTheme(t.id);
                closePopover();
                trigger.focus();
            });
            popover.appendChild(btn);
        });

        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            if (popover.classList.contains('show')) { closePopover(); } else { openPopover(); }
        });

        var savedColorTheme = localStorage.getItem(COLOR_STORAGE_KEY) || 'slate';
        if (savedColorTheme !== 'slate' && !COLOR_THEMES.some(function(t) { return t.id === savedColorTheme; })) {
            // Stale id from a since-removed theme (e.g. "indigo", merged into
            // Violet during the palette rebalance) -- otherwise this sets a
            // data-color-theme attribute with no matching CSS rule and no
            // swatch that shows as active, silently rendering the default
            // palette with nothing checked in the picker.
            localStorage.removeItem(COLOR_STORAGE_KEY);
            savedColorTheme = 'slate';
        }
        applyColorTheme(savedColorTheme);
    })();

    document.getElementById('shutdown-button').addEventListener('click', function(e) {
      e.preventDefault();
      if (confirm('Are you sure you want to shut down the server?')) {
        // Send shutdown request (server will perform graceful cleanup before exit).
        fetch("{{ url_for('shutdown') }}", { method: 'POST' });

        showShutdownOverlay();

        // Give the fetch request a moment to be sent before closing.
        setTimeout(function() {
          window.close();
        }, 750);
      }
    });
    </script>
    <div id="settings-saved-toast" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100;">
        <div class="toast align-items-center border-0" role="alert" aria-live="assertive"
             style="background-color:var(--card-color);color:var(--text-color);">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-check-circle-fill text-success me-2"></i>Settings saved.
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('saved') === '1') {
            history.replaceState({}, '', window.location.pathname);
            var toastEl = document.querySelector('#settings-saved-toast .toast');
            new bootstrap.Toast(toastEl, { delay: 3000 }).show();
        }
    })();
    </script>
</body>
</html>
