{% extends "base.html" %}
{% block content %}
<div class="text-center screen">
    <h1 class="visually-hidden">Session Paused</h1>
    <div class="console-hero">
        <span class="console-hero-label">Paused</span>
        <div>
            <span class="console-hero-value is-time" id="time_active">{{ time_active }}</span>
        </div>
        <span class="console-hero-unit d-block mt-1" style="margin-left:0;">elapsed</span>
        <p id="transitioning-hint" class="text-muted mt-3 mb-0" style="display:none;font-size:0.85rem;">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Pausing belt&hellip;
        </p>
    </div>

    <div class="console-strip">
        <div class="console-strip-item">
            <span class="console-strip-label">Distance</span>
            <span class="console-strip-value" id="distance">{{ "%.2f"|format(distance) }} mi</span>
        </div>
        <div class="console-strip-item">
            <span class="console-strip-label">Steps</span>
            <span class="console-strip-value" id="steps">{{ steps|int }}</span>
        </div>
        <div class="console-strip-item">
            <span class="console-strip-label">Calories</span>
            <span class="console-strip-value" id="calories">{{ "%.0f"|format(calories) }}</span>
        </div>
    </div>

    <div class="dock">
        <div class="d-flex justify-content-center gap-3 mt-4 action-row">
            <form method="post" action="{{ url_for('resume_session') }}" style="display:contents">
                <button id="btn-resume" type="submit" class="btn btn-custom-primary d-flex align-items-center gap-2"{{ hotkey("Space") }}>
                    <i class="bi bi-play-fill"></i> Resume
                </button>
            </form>
            <form method="post" action="{{ url_for('end_session') }}" style="display:contents">
                <button id="btn-end" type="submit" class="btn btn-custom-danger">
                    <i class="bi bi-stop-fill"></i> End Session
                </button>
            </form>
        </div>
    </div>
</div>

<script>
  var pausedButtons = [document.getElementById('btn-resume'), document.getElementById('btn-end')];
  disableButtonsOnSubmit(pausedButtons);
  initTransitioning('transitioning-hint', pausedButtons, {{ belt_transitioning|tojson }});

  startStatsStream(function(data) {
    if (data.session_active === false) {
      window.location.reload();
      return;
    }
    setTransitioning('transitioning-hint', pausedButtons, data.belt_transitioning === true);
  });
</script>

{% endblock %}
