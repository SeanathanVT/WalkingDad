{% extends "base.html" %}
{% block content %}
<div class="text-center">
    <h1 class="content-title mb-4">Session Paused</h1>

    <div class="row g-4 mb-5">
        <div class="col-lg col-md-4 col-6">
            <div class="stat-card">
                <p class="stat-label">Time</p>
                <p class="stat-value" id="time_active">{{ time_active }}</p>
            </div>
        </div>
        <div class="col-lg col-md-4 col-6">
            <div class="stat-card">
                <p class="stat-label">Speed</p>
                <p class="stat-value" id="speed">0.0 mph</p>
            </div>
        </div>
        <div class="col-lg col-md-4 col-6">
            <div class="stat-card">
                <p class="stat-label">Distance</p>
                <p class="stat-value" id="distance">{{ "%.2f"|format(distance) }} mi</p>
            </div>
        </div>
        <div class="col-lg col-md-4 col-6">
            <div class="stat-card">
                <p class="stat-label">Steps</p>
                <p class="stat-value" id="steps">{{ steps|int }}</p>
            </div>
        </div>
        <div class="col-lg col-md-4 col-6">
            <div class="stat-card">
                <p class="stat-label">Calories</p>
                <p class="stat-value" id="calories">{{ "%.0f"|format(calories) }}</p>
            </div>
        </div>
    </div>

    <p id="transitioning-hint" class="text-muted mb-2" style="display:none;font-size:0.9rem;">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Pausing belt&hellip;
    </p>
    <div class="d-flex justify-content-center gap-3">
        <form method="post" action="{{ url_for('resume_session') }}" style="display:contents">
            <button id="btn-resume" type="submit" class="btn btn-custom-primary">Resume</button>
        </form>
        <form method="post" action="{{ url_for('end_session') }}" style="display:contents">
            <button id="btn-end" type="submit" class="btn btn-custom-danger">
                <i class="bi bi-stop-fill"></i> End Session
            </button>
        </form>
    </div>
</div>

<script>
  function setTransitioning(on) {
    var hint = document.getElementById('transitioning-hint');
    var btnResume = document.getElementById('btn-resume');
    var btnEnd = document.getElementById('btn-end');
    hint.style.display = on ? '' : 'none';
    btnResume.disabled = on;
    btnEnd.disabled = on;
    btnResume.style.opacity = on ? '0.5' : '';
    btnEnd.style.opacity = on ? '0.5' : '';
  }

  // Disable buttons immediately on submit so a double-tap can't fire twice.
  document.querySelectorAll('form').forEach(function(form) {
    form.addEventListener('submit', function() {
      setTransitioning(true);
      document.getElementById('transitioning-hint').style.display = 'none';
    });
  });

  var _shutdownShown = false;

  function pollStats() {
    fetch("{{ url_for('get_stats') }}")
      .then(response => response.json())
      .then(data => {
        if (data.stopping === true && !_shutdownShown) {
          _shutdownShown = true;
          showShutdownOverlay();
          return;
        }
        if (data.is_connected === false) {
          window.location.reload();
          return;
        }
        setTransitioning(data.belt_transitioning === true);
      });
  }

  // Check immediately on page load so Resume is disabled if the pause
  // sequence is still in flight when the browser lands here.
  pollStats();
  setInterval(pollStats, 1500);
</script>

{% endblock %}
